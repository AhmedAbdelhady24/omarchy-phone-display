name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq iproute2
      - name: Bash syntax and JSON
        run: |
          bash -n phone-display.sh install.sh
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool i18n/en.json >/dev/null
      - name: Lifecycle regressions
        run: python3 -m unittest discover -s tests -v
      - name: Display layout regressions
        run: |
          node tests/test_layout.cjs
          node tests/test_colors.cjs
